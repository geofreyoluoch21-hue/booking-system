<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin | Bookings</title><link rel="stylesheet" href="style.css"></head>
<body><main class="wrap" style="padding:30px 20px">
<h2>Bookings admin</h2>
<form id="login" style="max-width:340px">
  <label for="e" style="color:var(--chalk)">Email</label><input id="e" type="email" required>
  <label for="p" style="color:var(--chalk)">Password</label><input id="p" type="password" required>
  <p style="margin-top:14px"><button class="btn" type="submit">Sign in</button></p><div id="m" class="msg err"></div>
</form>
<div id="panel" hidden>
  <p class="sub">Match each M-Pesa code against your M-Pesa till statement, then confirm or reject.</p>
  <div style="overflow-x:auto"><table><thead><tr><th>Ref</th><th>Name</th><th>Phone</th><th>Ticket</th><th>Qty</th><th>M-Pesa code</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb = supabase.createClient("https://jtjpeoxnahtfjkixabcf.supabase.co", "sb_publishable_famxwWBU9nnoRS4X-1Xojw_OfZ4r0_L");
const $ = (i) => document.getElementById(i);
async function load() {
  const { data, error } = await sb.from("bookings").select("*, ticket_tiers(name)").order("created_at", { ascending: false });
  if (error) { $("m").textContent = error.message; return; }
  $("login").hidden = true; $("panel").hidden = false;
  $("rows").innerHTML = data.map((b) => `<tr><td>${b.reference}</td><td>${esc(b.full_name)}</td><td>${esc(b.phone)}</td>
    <td>${b.ticket_tiers.name}</td><td>${b.quantity}</td><td>${esc(b.mpesa_code)}</td>
    <td><span class="badge ${b.status}">${b.status}</span></td>
    <td>${b.status === "pending" ? `<button class="btn" onclick="setS('${b.id}','confirmed')">Confirm</button> <button class="btn alt" onclick="setS('${b.id}','rejected')">Reject</button>` : ""}</td></tr>`).join("");
}
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
async function setS(id, status) { await sb.from("bookings").update({ status }).eq("id", id); load(); }
$("login").onsubmit = async (e) => {
  e.preventDefault();
  const { error } = await sb.auth.signInWithPassword({ email: $("e").value, password: $("p").value });
  if (error) $("m").textContent = error.message; else load();
};
sb.auth.getSession().then(({ data }) => data.session && load());
</script></body></html>
